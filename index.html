<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B4561A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다이어리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>2026–27 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
html{box-sizing:border-box;-webkit-text-size-adjust:100%;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<style>
/* Layout: an orange-leather A5 diary with chocolate trim and a gold J clasp open on a desk; tap the page edge to turn, a capture sheet and a record box float above it. */
:root{
  --desk:#E9E4DD; --desk2:#D3CBC0;
  --ui:#2E241C; --ui-mute:#7A6A5B; --ui-bg:rgba(251,248,242,.86); --ui-line:rgba(46,36,28,.14); --ui-on:#FBF8F2;
  --leather:#E3742A; --leather2:#B4561A; --stitch:#FFF1DE; --choc:#4A2B1A;
  --paper:#FBF8F2; --edge1:#EFE8DC; --edge2:#D8CDBD;
  --rule:#E4D6C4; --ink:#2E241C; --mute:#8E7D6D; --head:#6B4226; --pen:#3A2A1E;
  --sun:#B5432C; --sat:#3A5F8F; --star:#C47A1C; --star-soft:#EFD8B4;
  --tab1:#A06A3B; --tab2:#87552E;
  --grain:none;
  --f-num:"Gaegu","Jua","Apple SD Gothic Neo",cursive;
  --f-ko:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --f-ui:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pen:"Nanum Pen Script","Gowun Batang",cursive;
  --pw:400px; --ph:566px; --bw:800px; --tw:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1E1A17; --desk2:#110E0C;
    --ui:#F1E9DF; --ui-mute:#B3A595; --ui-bg:rgba(40,33,28,.88); --ui-line:rgba(255,240,225,.14); --ui-on:#1E1A17;
    --leather:#D96B24; --leather2:#B4561A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1E1A17; --desk2:#110E0C;
  --ui:#F1E9DF; --ui-mute:#B3A595; --ui-bg:rgba(40,33,28,.88); --ui-line:rgba(255,240,225,.14); --ui-on:#1E1A17;
  --leather:#D96B24; --leather2:#B4561A;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 45%,var(--desk),var(--desk2));color:var(--ui);font-family:var(--f-ui);touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding-inline:16px}
#wrap{position:relative;width:var(--bw);height:var(--ph)}
.single #wrap{transform:translateX(calc(var(--tw) / -2))}

/* leather cover with saddle stitching */
#cover{position:absolute;inset:calc(var(--pw)*-.026) calc(var(--pw)*-.034);border-radius:calc(var(--pw)*.022);
  background:
    linear-gradient(90deg,transparent 49.3%,rgba(40,20,8,.45) 50%,transparent 50.7%),
    radial-gradient(90% 70% at 30% 20%,rgba(255,220,180,.16),transparent 60%),
    radial-gradient(80% 80% at 80% 90%,rgba(120,40,0,.18),transparent 70%),
    var(--grain),var(--leather);
  box-shadow:0 30px 60px -20px rgba(30,15,5,.55),0 8px 18px rgba(30,15,5,.25),inset 0 0 0 calc(var(--pw)*.006) var(--choc)}
#cover::after{content:"";position:absolute;inset:calc(var(--pw)*.011);border:1.5px dashed var(--stitch);border-radius:calc(var(--pw)*.016);opacity:.75}
.single #cover{background:radial-gradient(90% 70% at 30% 20%,rgba(255,220,180,.16),transparent 60%),radial-gradient(80% 80% at 80% 90%,rgba(40,20,8,.28),transparent 70%),var(--grain),var(--leather)}

#book{position:absolute;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:15px}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
#slU,#slT{left:0} #srU,#srT{left:var(--pw)}
.slot.lift{z-index:5;pointer-events:none}
.single #slU,.single #slT{display:none} .single #srU,.single #srT{left:0}
#bandWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:12}
#band{position:absolute;left:0;top:calc(var(--ph)*-.08);height:calc(var(--ph)*1.16);width:0;opacity:0;border-radius:45% / 4%;will-change:transform,width}
#band.fwd{background:linear-gradient(90deg,rgba(60,38,20,0),rgba(60,38,20,.1) 10%,#EFE7DA 24%,#FFFDF9 46%,#F1E9DC 64%,#D6C8B3 80%,rgba(60,38,20,.32) 90%,rgba(60,38,20,0))}
#band.bwd{background:linear-gradient(270deg,rgba(60,38,20,0),rgba(60,38,20,.1) 10%,#EFE7DA 24%,#FFFDF9 46%,#F1E9DC 64%,#D6C8B3 80%,rgba(60,38,20,.32) 90%,rgba(60,38,20,0))}

/* front cover: orange leather, chocolate spine and edge, gold J clasp on a leather tab */
#front{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);display:none;border:0;padding:0;margin:0;cursor:pointer;z-index:30;
  border-radius:calc(var(--pw)*.025) calc(var(--pw)*.04) calc(var(--pw)*.04) calc(var(--pw)*.025);transform-origin:0 50%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.55,.05,.3,1);
  background:
    linear-gradient(90deg,var(--choc) 0,var(--choc) 3.2%,rgba(255,220,180,.35) 3.4%,rgba(120,40,0,.18) 3.8%,transparent 6.5%),
    radial-gradient(120% 80% at 28% 10%,rgba(255,236,205,.26),transparent 55%),
    radial-gradient(110% 90% at 92% 108%,rgba(120,40,0,.22),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,246,232,.05) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(-45deg,rgba(110,40,0,.06) 0 1px,transparent 1px 3px),
    var(--grain),var(--leather);
  box-shadow:inset 0 0 0 calc(var(--pw)*.007) var(--choc),inset 0 0 calc(var(--pw)*.05) rgba(120,40,0,.2),
    3px 2px 0 #EFE8DC,5px 3px 0 #D6CCBC,7px 4px 0 #EFE8DC,8px 5px 0 var(--choc),
    0 34px 60px -18px rgba(30,15,5,.55),0 10px 20px rgba(30,15,5,.22)}
.closed #front{display:block}
.closed #book,.closed #tabs,.closed #cover{display:none}
#front.swung{transform:perspective(calc(var(--pw)*5)) rotateY(-178deg)}
#front:focus-visible{outline:3px solid var(--star);outline-offset:6px}
.f-stitch{position:absolute;top:calc(var(--pw)*.035);bottom:calc(var(--pw)*.035);left:calc(var(--pw)*.065);right:calc(var(--pw)*.035);
  border:calc(var(--pw)*.0035) dashed var(--stitch);border-radius:calc(var(--pw)*.016);pointer-events:none;opacity:.85;filter:drop-shadow(0 1px 0 rgba(120,40,0,.35))}
.f-yr{position:absolute;left:3%;right:0;bottom:9%;text-align:center;font:700 calc(var(--pw)*.042)/1 var(--f-num);letter-spacing:.4em;padding-left:.55em;pointer-events:none;
  color:var(--choc);text-shadow:0 1px 0 rgba(255,236,205,.4)}
.f-clasp{position:absolute;right:calc(var(--pw)*-.03);top:42%;width:40%;pointer-events:none;overflow:visible}
.f-clasp svg{display:block;width:100%;height:auto;overflow:visible}
.f-hint{position:absolute;left:0;right:0;bottom:-2.4em;text-align:center;font:600 12px var(--f-ui);color:var(--ui-mute);letter-spacing:.08em;pointer-events:none}
.closed #where{min-width:auto}
.t-j{font:700 2.6em/1 var(--f-num);background:linear-gradient(160deg,#8A6A2F,#D8B868 35%,#A9843A 55%,#E3C77E 75%,#8E6C2C);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* page-turn edges */
.edge{position:absolute;top:0;bottom:0;width:1.55em;z-index:15;border:0;padding:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;color:var(--mute);font:700 1.6em/1 var(--f-num);-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.edge span{font-size:1em;opacity:.55;transition:opacity .2s}
.edge.next{right:0;background:linear-gradient(270deg,rgba(107,66,38,.07),transparent)}
.edge.prev{left:0;background:linear-gradient(90deg,rgba(107,66,38,.07),transparent)}
.edge:hover span,.edge:active span{opacity:1;color:var(--head)}
.edge.next:active{background:linear-gradient(270deg,rgba(107,66,38,.18),transparent)}
.edge.prev:active{background:linear-gradient(90deg,rgba(107,66,38,.18),transparent)}
.edge:disabled{visibility:hidden}

/* ---------- paper ---------- */
.page{position:absolute;inset:0;background-color:var(--paper);background-image:var(--grain);color:var(--ink);overflow:hidden}
.page::after{content:"";position:absolute;top:0;bottom:0;width:10%;pointer-events:none;z-index:4}
.page.left::after{right:0;background:linear-gradient(270deg,rgba(50,30,15,.15),rgba(50,30,15,.04) 45%,transparent)}
.page.right::after{left:0;background:linear-gradient(90deg,rgba(50,30,15,.15),rgba(50,30,15,.04) 45%,transparent)}
.single .page.left::after{display:none}
.pg-in{position:absolute;top:2.1em;bottom:2.3em;left:2.5em;right:1.8em;display:flex;flex-direction:column;min-height:0}
.page.left .pg-in{left:1.8em;right:2.5em}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.folio{position:absolute;bottom:.95em;font:.6em var(--f-ui);color:var(--mute);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.page.right .folio{right:3em} .page.left .folio{left:3em}
.endpaper{background-color:#EADCC6;background-image:radial-gradient(circle at 25% 25%,rgba(107,66,38,.24) .1em,transparent .13em),radial-gradient(circle at 75% 75%,rgba(107,66,38,.14) .08em,transparent .11em);background-size:1.3em 1.3em}
.blankback{background-color:var(--paper)}

textarea,input{box-sizing:border-box;font:inherit;color:var(--pen);border:0;outline:none;resize:none;background:transparent;margin:0;padding:0;width:100%;-webkit-user-select:text;user-select:text}
textarea::placeholder,input::placeholder{color:var(--mute);opacity:.6}
.page textarea:focus{background-color:rgba(107,66,38,.05)}
.w{flex:1;min-height:0;font-family:var(--f-pen);font-size:1.2em;line-height:1.55em;padding-inline:.15em;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.55em - 1px),var(--rule) calc(1.55em - 1px),var(--rule) 1.55em);
  background-attachment:local}
.one{font-family:var(--f-pen);font-size:1.2em;line-height:1.5em;height:1.5em;overflow:hidden;white-space:nowrap}
button{font:inherit;color:inherit}
.page button{-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--star);outline-offset:2px}

.hd{display:flex;align-items:baseline;justify-content:space-between;gap:.6em;padding-bottom:.4em;border-bottom:2.5px solid var(--mc,var(--tab1));border-radius:0 0 2px 2px}
.hd-t{font:400 1.1em var(--f-ko);color:var(--head)}
.hd-s{font:600 .58em var(--f-ui);letter-spacing:.16em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4em;padding-top:4%;min-height:0}
.t-scene{width:100%;max-width:100%;height:auto;flex:none;margin:.4em 0 .6em;filter:drop-shadow(0 2px 2px rgba(60,30,10,.12))}
.t-top{font:600 .62em var(--f-ui);letter-spacing:.6em;color:var(--mute);padding-left:.6em}
.t-year{font:700 6.4em/.95 var(--f-num);color:var(--head);letter-spacing:-.01em}
.t-year.t-span{font-size:5.6em;white-space:nowrap}
.t-year small{font-size:.6em;margin:0 .08em;vertical-align:.18em}
.t-sub{font:.86em var(--f-ui);color:var(--ink);letter-spacing:.04em}
.t-rule{width:2.4em;height:2px;background:var(--head);margin:1.2em 0 1.6em}
.t-own{width:72%;display:flex;flex-direction:column;gap:.3em}
.t-own label{font:600 .56em var(--f-ui);letter-spacing:.2em;color:var(--mute)}
.t-own textarea{font:1.7em/1.4 var(--f-pen);height:1.4em;text-align:center;border-bottom:1px solid var(--rule);overflow:hidden;white-space:nowrap}
.t-hint{margin-top:auto;font:.6em/1.9 var(--f-ui);color:var(--mute)}

/* year */
.yr-g{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:.6em 1.4em;padding-top:.9em}
.mini{min-width:0}
.mini-h{display:flex;align-items:baseline;gap:.35em;margin-bottom:.15em}
.mini-h b{font:700 1.6em var(--f-num);color:var(--mci,var(--leather2))}
.mini-h span{font:700 .9em var(--f-num);color:var(--mute)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);font:.6em/1.85 var(--f-ui);text-align:center;font-variant-numeric:tabular-nums}
.mini-g i{font-style:normal;font-weight:600;color:var(--mute)}
.mini-g button{border:0;background:none;padding:0;line-height:inherit;border-radius:50%}
.sun,.mini-g .sun{color:var(--sun)} .sat,.mini-g .sat{color:var(--sat)}

/* month */
.m-h{display:flex;align-items:flex-end;gap:.45em;margin-bottom:.55em}
.m-num{font:700 4em/.75 var(--f-num);color:var(--mci,var(--leather2));font-variant-numeric:lining-nums}
.m-en{font:700 1.45em/1 var(--f-num);color:var(--head)}
.m-fl{width:2.4em;height:2.4em;flex:none;margin-left:.4em;transform:rotate(-8deg);filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 2px 2px rgba(60,30,10,.2))}
.m-y{margin-left:auto;font:600 .58em var(--f-ui);letter-spacing:.24em;color:var(--mute)}
.cal{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2.5px solid var(--mc,var(--tab1));border-bottom:1px solid var(--rule);border-radius:2px}
.wh{font:600 .55em var(--f-ui);padding:.5em .35em .35em;letter-spacing:.12em;color:var(--mute)}
.wh.sun{color:var(--sun)} .wh.sat{color:var(--sat)}
.cell{border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:.18em .22em 0;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.cell:nth-child(7n+1){border-left:0}
.cell.e{background:rgba(228,214,196,.22)}
.cell .d{border:0;background:none;padding:0;font:700 1.1em/1 var(--f-num);align-self:flex-start;color:var(--ink)}
.cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
.hl{font:.46em/1.3 var(--f-ui);color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl.soft,.hol.soft{color:var(--mute)}
.cell textarea{flex:1;min-height:0;font:.92em/1.15 var(--f-pen);overflow:hidden}

/* monthly plan */
.sec{font:400 .72em var(--f-ko);letter-spacing:.06em;color:var(--mci,var(--leather2));padding:1.3em 0 .4em;border-bottom:1.5px dashed rgba(160,106,59,.55)}
.goal{display:flex;align-items:center;gap:.55em;border-bottom:1px solid var(--rule);height:1.95em}
.ck{flex:none;width:.95em;height:.95em;border:1.5px solid var(--head);border-radius:.18em;background:transparent;padding:0;position:relative}
.ck.on{background:var(--head)}
.ck.on::after{content:"";position:absolute;left:.26em;top:.08em;width:.22em;height:.46em;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.hab{padding-top:.4em}
.hn{font-size:1.1em;border-bottom:1px dashed var(--rule)}
.dots{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:.18em;padding-top:.3em}
.dot{aspect-ratio:1;max-width:100%;border:1px solid var(--rule);border-radius:50%;background:transparent;padding:0;font:600 .42em var(--f-ui);color:var(--mute);font-variant-numeric:tabular-nums}
.dot.on{background:#79BB5C;border-color:#4F9238;color:#FFFFFF}
.memo{padding-top:.3em}

/* week */
.days{flex:1;min-height:0;display:flex;flex-direction:column}
.day{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1.5px dashed rgba(160,106,59,.55)}
.day:last-child{border-bottom:0}
.day-h{display:flex;align-items:baseline;gap:.45em;padding:.35em 0 .05em}
.day-h .n{font:700 1.95em/1 var(--f-num);color:var(--ink);font-variant-numeric:lining-nums}
.day.sun .n{color:var(--sun)} .day.sat .n{color:var(--sat)}
.day.out .n{color:var(--mute);opacity:.7}
.day-h .wd{font:600 .56em var(--f-ui);letter-spacing:.14em;color:var(--mute)}
.tag{font:600 .5em var(--f-ui);letter-spacing:.1em;color:var(--paper);background:var(--mute);padding:.15em .45em;border-radius:1em}
.hol{margin-left:.2em;font:600 .56em var(--f-ui);color:var(--sun);white-space:nowrap}
.habs{margin-left:auto;display:flex;gap:.45em;min-width:0;align-self:center}
.hb{display:flex;align-items:center;gap:.3em;border:0;background:none;padding:.2em 0;min-width:0;max-width:7em;font:600 .52em var(--f-ui);color:var(--mute)}
.hb i{flex:none;width:1.75em;height:1.75em;border:1.6px solid var(--head);border-radius:.32em;position:relative;background:var(--paper)}
.hb.unnamed span{opacity:.55}
.hb.on i{background:#79BB5C;border-color:#4F9238}
.hb.on i::after{content:"";position:absolute;left:.48em;top:.18em;width:.4em;height:.8em;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb.on span{color:var(--head)}
.row .hb span{display:none}
.hb-add{border:1px dashed var(--edge2);background:none;border-radius:1em;padding:.25em .7em;font:600 .5em var(--f-ui);color:var(--mute);white-space:nowrap}
.row .hb-add{display:none}
.habs .hb-add{padding:.25em .55em}
.sec-n{font-weight:400;letter-spacing:0;color:var(--mute);margin-left:.6em}
.top{display:flex;align-items:center;gap:.3em;background:linear-gradient(90deg,rgba(239,216,180,.55),rgba(239,216,180,0));border-radius:.3em;padding-left:.3em;margin:.1em 0 .05em}
.top .star{color:var(--star);font-size:.75em;flex:none}
.top textarea{color:var(--head);font-size:1.15em}
.row{flex:1;min-height:0;display:flex;gap:1.1em;border-bottom:1.5px dashed rgba(160,106,59,.55)}
.row .day{border-bottom:0;min-width:0}
.wnote{flex:.7}
.wnote .day-h{padding-top:.6em}
.wnote .wd{color:var(--head)}

/* today, top check, day to-dos */
.day.today .day-h .n{background:rgba(75,166,216,.16);border-radius:50%;padding:.08em .22em;box-shadow:0 0 0 .1em #4BA6D8}
.tag.now{background:#4BA6D8}
.cell.today{background:rgba(75,166,216,.1);box-shadow:inset 0 0 0 2.5px #4BA6D8;border-radius:6px}
.top .tck,.ti .tck{flex:none;width:.95em;height:.95em;border:1.5px solid var(--star);border-radius:.2em;background:transparent;padding:0;position:relative}
.tck.on{background:var(--star)}
.tck.on::after{content:"";position:absolute;left:.27em;top:.07em;width:.22em;height:.46em;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.top.done textarea,.top.moved textarea{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--mute)}
.top .mv{flex:none;font:600 .5em var(--f-ui);color:var(--mute);padding-right:.5em;white-space:nowrap}
.todo{display:flex;flex-direction:column;gap:.1em;padding:.15em 0 0 .3em}
.todo:empty{display:none}
.ti{display:flex;align-items:center;gap:.35em;min-width:0;font:1.05em/1.35 var(--f-pen);color:var(--pen)}
.ti .tck{border-color:var(--head)} .ti .tck.on{background:var(--head)}

<script>
(() => {
const MO = []; for (let i = 0; i < 12; i++){ const x = new Date(2026, 9 + i, 1); MO.push({y: x.getFullYear(), m: x.getMonth()}); }
const Y = 2027; // 마지막 해 (표지 표기용)
const MO_FIRST = new Date(MO[0].y, MO[0].m, 1), MO_LAST = new Date(MO[11].y, MO[11].m + 1, 0);
const mkey = mi => `${MO[mi].y}-${MO[mi].m}`;
// 그림책 크레용 색: [탭·선 색, 크림 종이 위 글자 색, 탭 위 글자 색]
const CR = {orange:['#EE8A3C','#C4601C','#FFFFFF'], purple:['#9C7FCF','#6E52A8','#FFFFFF'], red:['#D9503F','#B23A2C','#FFFFFF'], blue:['#4F86D6','#2F62AE','#FFFFFF'],
  pink:['#EE93B0','#C2577C','#FFFFFF'], green:['#6FB352','#3F8A2C','#FFFFFF'], yellow:['#EDBE36','#97710E','#4A2B1A'], sky:['#4BA6D8','#23739E','#FFFFFF']};
const MCK = ['orange','purple','red','blue','pink','green','yellow','sky','orange','blue','green','pink'];
const MC = MCK.map(k => CR[k]);
function mcStyle(mi){ const c = MC[mi]; return `--mc:${c[0]};--mci:${c[1]};--mcf:${c[2]}`; }
function moIndex(d){ const i = (d.getFullYear() - MO[0].y) * 12 + d.getMonth() - MO[0].m; return i >= 0 && i < 12 ? i : -1; }
const WD = ['일','월','화','수','목','금','토'];
const WE = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ENS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
// 공휴일 (대체공휴일 포함), 키: 연-월-일
const HOL = {'2026-10-3':'개천절','2026-10-5':'대체공휴일','2026-10-9':'한글날','2026-12-25':'성탄절',
  '2027-1-1':'신정','2027-2-6':'설 연휴','2027-2-7':'설날','2027-2-8':'설 연휴','2027-2-9':'대체공휴일','2027-3-1':'삼일절',
  '2027-5-5':'어린이날','2027-5-13':'부처님오신날','2027-6-6':'현충일','2027-7-17':'제헌절','2027-7-19':'대체공휴일','2027-8-15':'광복절','2027-8-16':'대체공휴일',
  '2027-9-14':'추석 연휴','2027-9-15':'추석','2027-9-16':'추석 연휴'};
const SOFT = {'5-1':'노동절','5-8':'어버이날','5-15':'스승의 날'};
const TAGS = {important:'★ 중요', todo:'할 일', idea:'아이디어', remember:'기억할 것'};

/* ---------- storage ---------- */
function load(k, def){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch(e){ return def; } }
const TX = load('d2028-text', {}), INK = load('d2028-ink', {});
let CAP = load('d2028-cap', []); if (!Array.isArray(CAP)) CAP = [];
function migrateTX(){
  const moved = [];
  Object.keys(TX).forEach(k => {
    let m = k.match(/^(c|g|gc|hn)-(\d{1,2})-(\d+)$/), nk = null;
    if (m) nk = `${m[1]}-2027-${m[2]}-${m[3]}`;
    else if ((m = k.match(/^h-(\d{1,2})-(\d)-(\d+)$/))) nk = `h-2027-${m[1]}-${m[2]}-${m[3]}`;
    else if (/^mm-\d{1,2}$/.test(k)) nk = 'mm-2027-' + k.slice(3);
    if (!nk) return;
    if (!(nk in TX)) TX[nk] = TX[k];
    delete TX[k]; moved.push(k, nk);
  });
  return moved;
}
let txT = 0;
function saveTX(k){ if (k) { txDirty.add(k); queueSync(); } clearTimeout(txT); txT = setTimeout(() => { try { localStorage.setItem('d2028-text', JSON.stringify(TX)); } catch(e){ toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); } }, 300); }
function saveInk(i){ if (i != null) { inkDirty.add(pid(i)); queueSync(); } try { localStorage.setItem('d2028-ink', JSON.stringify(INK)); } catch(e){ toast('필기 저장 공간이 가득 찼어요. 일부 필기를 지워 주세요.'); } }
function saveCap(id){ if (id) { capDirty.add(id); queueSync(); } try { localStorage.setItem('d2028-cap', JSON.stringify(CAP)); } catch(e){ toast('기록을 저장하지 못했어요. 저장 공간을 확인해 주세요.'); } updateBadge(); }
const toastEl = document.getElementById('toast'); let toT = 0;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toT); toT = setTimeout(() => toastEl.classList.remove('show'), 2600); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- build page list ---------- */
const pages = [{t:'title'}, {t:'year',half:0}, {t:'year',half:1}];
const weeksByMonth = Array.from({length:12}, () => []);
{ const first = addD(MO_FIRST, -((MO_FIRST.getDay() + 6) % 7));
  for (let mon = first; mon <= MO_LAST; mon = addD(mon, 7)) weeksByMonth[Math.max(0, moIndex(mon))].push(mon); }
const monthStart = [], weekPage = {};
for (let m = 0; m < 12; m++){
  monthStart[m] = pages.length;
  pages.push({t:'month', m}, {t:'plan', m});
  weeksByMonth[m].forEach((mon, n) => {
    const idx = pages.length;
    for (let d = 0; d < 7; d++){ const x = addD(mon, d); weekPage[`${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`] = idx; }
    pages.push({t:'wk', m, n:n+1, mon, side:0}, {t:'wk', m, n:n+1, mon, side:1});
  });
}
pages.push({t:'end'});
const N = pages.length;
{ const mv = migrateTX(); if (mv.length) setTimeout(() => { mv.forEach(k => txDirty.add(k)); try { localStorage.setItem('d2028-text', JSON.stringify(TX)); } catch(e){} }, 0); }
function pid(i){
  const p = pages[i]; if (!p) return 'x' + i;
  if (p.t === 'year') return 'year-' + p.half;
  if (p.t === 'month' || p.t === 'plan') return p.t + '-' + MO[p.m].y + '-' + MO[p.m].m;
  if (p.t === 'wk') return `wk-${p.mon.getFullYear()}-${p.mon.getMonth()+1}-${p.mon.getDate()}-${p.side}`;
  if (p.t === 'note') return 'note-' + p.n;
  return p.t;
}
Object.keys(INK).forEach(k => { if (/^\d+$/.test(k)){ if (pages[+k] && !INK[pid(+k)]) INK[pid(+k)] = INK[k]; delete INK[k]; } });
const wp = (y, m1, d) => weekPage[`${y}-${m1}-${d}`];

function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
function addD(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
const dkey = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function todayKey(){ return dkey(new Date()); }
function todayPage(){ const i = weekPage[todayKey()]; if (i == null) return null; const dw = new Date().getDay(); return !two && (dw === 0 || dw >= 4) ? i + 1 : i; }
function isoD(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getTodo(k){ try { const v = JSON.parse(TX['todo-' + k] || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
function setTodo(k, list){ if (list.length) TX['todo-' + k] = JSON.stringify(list); else delete TX['todo-' + k]; }
function fillTodo(root){
  root.querySelectorAll('[data-tk]').forEach(row => { const k = row.dataset.tk; row.classList.toggle('done', !!TX['tdone-' + k]); row.classList.toggle('moved', !!TX['tmv-' + k] && !TX['tdone-' + k]);
    let mv = row.querySelector('.mv'); if (row.classList.contains('moved')){ if (!mv){ mv = document.createElement('span'); mv.className = 'mv'; mv.textContent = '→ 오늘로 넘김'; row.appendChild(mv); } } else if (mv) mv.remove(); });
  root.querySelectorAll('[data-td]').forEach(box => {
    const k = box.dataset.td, list = getTodo(k);
    box.innerHTML = list.map((it, n) => it.m
      ? `<div class="ti moved"><button type="button" class="tck" tabindex="-1" aria-hidden="true"></button><span>${esc(it.t)}</span><em>→ 넘김</em></div>`
      : `<div class="ti${it.d ? ' on' : ''}${(it.n || 0) >= 3 && !it.d ? ' warn' : ''}"><button type="button" class="tck${it.d ? ' on' : ''}" data-ti="${k}|${n}" aria-label="완료"></button><span>${esc(it.t)}</span>${it.n ? `<em>${it.n}번 미룸</em>` : it.src ? '<em>기록함에서</em>' : ''}${(it.n || 0) >= 3 && !it.d ? `<button type="button" class="tdrop" data-tdrop="${k}|${n}">버리기</button>` : ''}</div>`).join('');
  });
}

/* ---------- page templates ---------- */
function mini(mi){
  const {y, m} = MO[mi], first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  let h = `<div class="mini" style="${mcStyle(mi)}"><div class="mini-h"><b>${m+1}</b><span>${EN[m]}${m === 0 || mi === 0 ? ' ' + y : ''}</span></div><div class="mini-g">`;
  WD.forEach((w, i) => h += `<i class="${i===0?'sun':i===6?'sat':''}">${w}</i>`);
  for (let i = 0; i < first; i++) h += '<span></span>';
  for (let d = 1; d <= days; d++){
    const dow = (first + d - 1) % 7;
    const c = HOL[`${y}-${m+1}-${d}`] || dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
    h += `<button type="button" class="${c}" data-go="${wp(y, m+1, d)}" aria-label="${y}년 ${m+1}월 ${d}일">${d}</button>`;
  }
  return h + '</div></div>';
}
function monthPage(mi){
  const {y, m} = MO[mi], mk = mkey(mi), first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate(), rows = Math.ceil((first + days) / 7);
  let c = '';
  WD.forEach((w, i) => c += `<div class="wh ${i===0?'sun':i===6?'sat':''}">${w}</div>`);
  for (let x = 0; x < rows * 7; x++){
    const d = x - first + 1;
    if (d < 1 || d > days){ c += '<div class="cell e"></div>'; continue; }
    const dow = x % 7, fk = `${y}-${m+1}-${d}`, h = HOL[fk], s = SOFT[`${m+1}-${d}`];
    c += `<div class="cell ${h || dow===0 ? 'sun' : dow===6 ? 'sat' : ''}${fk === todayKey() ? ' today' : ''}"><button type="button" class="d" data-go="${wp(y, m+1, d)}" aria-label="${m+1}월 ${d}일 주간 페이지">${d}</button>${h ? `<span class="hl">${h}</span>` : s ? `<span class="hl soft">${s}</span>` : ''}<div class="gcal mc" data-gd="${fk}"></div><textarea data-k="c-${mk}-${d}" spellcheck="false" aria-label="${m+1}월 ${d}일 메모"></textarea></div>`;
  }
  return `<div class="m-h"><span class="m-num">${String(m+1).padStart(2,'0')}</span><span class="m-en">${EN[m]}</span><span class="m-y">${y}</span>${monthFlower(mi)}</div><div class="cal" style="grid-template-rows:auto repeat(${rows},minmax(0,1fr))">${c}</div>`;
}
function habitName(mi, k){ for (let i = mi; i >= 0; i--){ const v = TX[`hn-${mkey(i)}-${k}`]; if (v && v.trim()) return v.trim(); } return ''; }
function planPage(mi){
  const {y, m} = MO[mi], mk = mkey(mi), days = new Date(y, m+1, 0).getDate();
  let h = `<div class="hd"><span class="hd-t">${m+1}월 계획</span><span class="hd-s">${EN[m].toUpperCase()} ${y}</span></div><div class="sec">이달의 목표</div>`;
  for (let n = 0; n < 3; n++) h += `<div class="goal"><button type="button" class="ck" data-c="gc-${mk}-${n}" aria-label="목표 ${n+1} 완료"></button><textarea class="one" data-k="g-${mk}-${n}" rows="1" spellcheck="false" aria-label="목표 ${n+1}"></textarea></div>`;
  h += '<div class="sec">매일 할 일<span class="sec-n">최대 4개 · 한 번 적으면 이달 모든 날짜에 체크칸이 생기고 다음 달로 이어져요</span></div>';
  for (let k = 0; k < 4; k++){
    const inh = mi > 0 ? habitName(mi - 1, k) : '';
    const ph = inh ? `${esc(inh)} · 지난달에서 이어짐` : `매일 할 일 ${k+1}`;
    h += `<div class="hab"><textarea class="one hn" data-k="hn-${mk}-${k}" rows="1" placeholder="${ph}" spellcheck="false" aria-label="매일 할 일 ${k+1}"></textarea><div class="dots">`;
    for (let d = 1; d <= days; d++) h += `<button type="button" class="dot" data-h="h-${mk}-${k}-${d}" aria-label="${d}일">${d}</button>`;
    h += '</div></div>';
  }
  return h;
}
function habitRow(d){
  const mi = moIndex(d); if (mi < 0) return '';
  const mk = mkey(mi), day = d.getDate();

/* ---------- sound ---------- */
let AC = null, soundOn = true;

    return;
  }
  const list = items.filter(x => x.trim());
  outList.innerHTML = list.map(it => `<button class="out-it${on.includes(it) ? ' on' : ''}" type="button" data-oc="${esc(it)}"><i></i>${esc(it)}</button>`).join('') || '<p class="empty">‘목록 고치기’로 챙길 것을 적어 두세요.</p>';
  const all = list.length && list.every(it => on.includes(it));

  outList.querySelectorAll('[data-oc]').forEach(b => b.onclick = () => { const it = b.dataset.oc, cur2 = outChecks(); const i2 = cur2.indexOf(it); if (i2 >= 0) cur2.splice(i2, 1); else cur2.push(it); setOutChecks(cur2); renderOut(); const all = outItems().filter(x => x.trim()); if (i2 < 0 && all.length && all.every(x => cur2.includes(x))) cheer(); });
}
document.getElementById('bOut').onclick = () => { outEditing = false; outEl.hidden = false; renderOut(); };

/* ---------- sync across devices: each person's private store ---------- */
var DB = null, UID = null, syncState = 'local', txDirty = new Set(), inkDirty = new Set(), capDirty = new Set(), vaultDirty = false, syncT = 0, docChain = {}, firstSync = true, retryT = 0;
const syncBtn = document.getElementById('syncBtn'), syncTxt = document.getElementById('syncTxt');
function setSync(st){
  syncState = st;
  syncBtn.className = st === 'ok' ? 'ok' : st === 'saving' || st === 'connecting' ? 'warn' : st === 'local' ? '' : 'bad';
  syncTxt.textContent = {local:'이 기기만', login:'로그인', nocfg:'설정 전', denied:'권한 오류', connecting:'연결 중', saving:'동기화 중', ok:'동기화됨', error:'동기화 실패', full:'공간 부족'}[st] || '';
}
var AUTH = null, FSDB = null, unsubSnap = null, USER_EMAIL = '', soArm = 0;
syncBtn.onclick = () => {
  if (syncState === 'login') return signIn();
  if (syncState === 'nocfg') return toast('firebase-config.js에 Firebase 설정을 넣어야 동기화돼요. README를 봐 주세요.');
  if (UID){
    if (Date.now() - soArm < 3000){ soArm = 0; AUTH.signOut(); toast('로그아웃했어요. 이 기기에 쓴 내용은 그대로 있어요.'); return; }
    soArm = Date.now(); toast(`${USER_EMAIL} 계정으로 동기화 중이에요. 로그아웃하려면 3초 안에 한 번 더 누르세요.`); return;
  }
  toast(syncMsg[syncState] || '');
};
const syncMsg = {
  local:'지금은 이 기기에만 저장돼요. 구글로 로그인하면 모든 기기에 동기화돼요.',
  connecting:'동기화 서버에 연결하고 있어요.', saving:'변경 내용을 올리고 있어요.',
  ok:'아이폰, 아이패드, 노트북 어디서 열어도 같은 내용이 보여요.',
  error:'잠시 연결이 안 돼요. 이 기기에는 저장돼 있고, 연결되면 다시 올려요.',
  full:'필기가 아주 많은 페이지나 기록은 동기화 한도를 넘어 이 기기에만 저장돼요.',
  denied:'Firestore 규칙이 막고 있어요. README의 규칙을 붙여 넣었는지 확인해 주세요.'
};
function shardOf(k){ let h = 0; for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0; return 'tx-' + (h % 16); }
function dref(id){ return FSDB.collection('users').doc(UID).collection('items').doc(id); }
function chain(id, fn){ const pr = (docChain[id] || Promise.resolve()).then(fn); docChain[id] = pr.catch(() => {}); return pr; }
function queueSync(){ if (!DB) return; clearTimeout(syncT); syncT = setTimeout(flushSync, 900); setSync('saving'); }
async function flushSync(){
  if (!DB) return;
  const jobs = [];
  const byShard = {};
  [...txDirty].forEach(k => { (byShard[shardOf(k)] = byShard[shardOf(k)] || {})[k] = k in TX ? TX[k] : null; }); txDirty.clear();
  for (const sh in byShard){
    const part = byShard[sh];
    jobs.push({redo: () => Object.keys(part).forEach(k => txDirty.add(k)), p: chain(sh, async () => {
      await dref(sh).set({v: part}, {merge: true});
    })});
  }
  [...inkDirty].forEach(pg => { inkDirty.delete(pg); const id = 'ink-' + pg; jobs.push({redo: () => inkDirty.add(pg), p: chain(id, () => (INK[pg] && INK[pg].length) ? dref(id).set({s: INK[pg]}) : dref(id).delete())}); });
  [...capDirty].forEach(cid => { capDirty.delete(cid); const id = 'cap-' + cid; jobs.push({redo: () => capDirty.add(cid), p: chain(id, () => { const c = CAP.find(x => x.id === cid); return c ? dref(id).set({c}) : dref(id).delete(); })}); });
  if (vaultDirty){ vaultDirty = false; jobs.push({redo: () => { vaultDirty = true; }, p: chain('vault', () => VAULT && VAULT.ct ? dref('vault').set({salt:VAULT.salt, iv:VAULT.iv, ct:VAULT.ct, hint:VAULT.hint || ''}) : Promise.resolve())}); }
  const res = await Promise.allSettled(jobs.map(j => j.p));
  let worst = 'ok';
  res.forEach((r, n) => {
    if (r.status !== 'rejected') return;
    const c = r.reason && r.reason.code;
    if (c === 'resource-exhausted' || c === 'invalid-argument'){ worst = 'full'; }
    else if (c === 'permission-denied' || c === 'unauthenticated'){ worst = 'denied'; }
    else { jobs[n].redo(); if (worst !== 'full') worst = 'error'; }
  });
  setSync(worst);
  if (worst === 'error'){ clearTimeout(retryT); retryT = setTimeout(() => { if (DB) flushSync(); }, 8000 + Math.random() * 4000); }
}
function persistLocal(){
  try { localStorage.setItem('d2028-text', JSON.stringify(TX)); localStorage.setItem('d2028-ink', JSON.stringify(INK)); localStorage.setItem('d2028-cap', JSON.stringify(CAP)); if (VAULT) localStorage.setItem('d2028-vault', JSON.stringify(VAULT)); } catch(e){}
}
function refreshAfterRemote(txKeys, inkPages){
  for (const [k, el] of cache){
    if (!el.isConnected){ cache.delete(k); continue; }
    txKeys.forEach(key => {
      el.querySelectorAll(`textarea[data-k="${key}"]`).forEach(t => { if (document.activeElement !== t) t.value = TX[key] || ''; });
      el.querySelectorAll(`[data-h="${key}"],[data-c="${key}"]`).forEach(b => b.classList.toggle('on', !!TX[key]));
    });
    if (inkPages.has(pid(k))) drawInk(el, k);
    fillTodo(el);
    if ([...txKeys].some(x => x.startsWith('stk-'))) renderStk(el, k);
  }
  if ([...txKeys].some(k => k.startsWith('hn-'))) rest();
  updateBadge();
  if (!boxEl.hidden) renderBox();
}
function takeVault(v){
  const nv = {v:1, salt:v.salt, iv:v.iv, ct:v.ct, hint:v.hint || ''};
  const changed = !VAULT || VAULT.ct !== nv.ct;
  VAULT = nv;
  if (changed && vKey){ lockVault(); toast('다른 기기에서 비밀 메모가 바뀌어 다시 잠갔어요.'); }
  else if (changed && !vaultEl.hidden) renderVault();
}
function applyDoc(id, d, txKeys, inkPages){
  if (id.startsWith('tx-') && d && d.v){ for (const k in d.v){ const v = d.v[k]; if (v == null){ if (k in TX){ delete TX[k]; txKeys.add(k); } } else if (TX[k] !== v){ TX[k] = v; txKeys.add(k); } } }
  else if (id.startsWith('ink-')){ const pg = id.slice(4); if (d && Array.isArray(d.s)) INK[pg] = d.s; else delete INK[pg]; inkPages.add(pg); }
  else if (id.startsWith('cap-')){ const cid = id.slice(4); const n = CAP.findIndex(x => x.id === cid); if (d && d.c){ if (n >= 0) CAP[n] = d.c; else CAP.push(d.c); } else if (n >= 0) CAP.splice(n, 1); CAP.sort((a, b) => b.t - a.t); }
  else if (id === 'vault' && d && d.ct) takeVault(d);
}
function onSnap(snap){
  const txKeys = new Set(), inkPages = new Set();
  if (firstSync){
    if (snap.metadata && snap.metadata.fromCache) return;
    firstSync = false;
    const remoteTx = new Set(), remoteInk = new Set(), remoteCap = new Set(); let remoteVault = false;
    snap.docs.forEach(doc => {
      const d = doc.data(); if (!d) return;
      if (doc.id.startsWith('tx-') && d.v) Object.keys(d.v).forEach(k => remoteTx.add(k));
      if (doc.id.startsWith('ink-')) remoteInk.add(doc.id.slice(4));
      if (doc.id.startsWith('cap-')) remoteCap.add(doc.id.slice(4));
      if (doc.id === 'vault') remoteVault = true;
      applyDoc(doc.id, d, txKeys, inkPages);
    });
    migrateTX().forEach(k => txDirty.add(k));
    Object.keys(TX).forEach(k => { if (!remoteTx.has(k)) txDirty.add(k); });
    Object.keys(INK).forEach(pg => { if (!remoteInk.has(pg) && INK[pg] && INK[pg].length) inkDirty.add(pg); });
    CAP.forEach(c => { if (!remoteCap.has(c.id)) capDirty.add(c.id); });
    if (!remoteVault && VAULT && VAULT.ct) vaultDirty = true;
    persistLocal(); refreshAfterRemote(txKeys, inkPages);
    if (!carryDone){ carryDone = true; runCarry(); }
    if (txDirty.size || inkDirty.size || capDirty.size || vaultDirty) flushSync(); else setSync('ok');
    return;
  }
  snap.docChanges().forEach(ch => {
    if (ch.doc.metadata && ch.doc.metadata.hasPendingWrites) return;
    applyDoc(ch.doc.id, ch.type === 'removed' ? null : ch.doc.data(), txKeys, inkPages);
  });
  if (txKeys.size || inkPages.size){ persistLocal(); }
  persistLocal(); refreshAfterRemote(txKeys, inkPages);
}
async function signIn(){
  if (!AUTH){ toast('firebase-config.js에 Firebase 설정을 넣어야 로그인할 수 있어요.'); return; }
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.addScope('https://www.googleapis.com/auth/calendar.readonly');
  if (USER_EMAIL) prov.setCustomParameters({login_hint: USER_EMAIL});
  try {
    const r = await AUTH.signInWithPopup(prov);
    const tok = r.credential && r.credential.accessToken;
    if (tok){ setCalTok(tok); ensureWatches(true); }
  } catch(e){
    const c = e && e.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment' || c === 'auth/web-storage-unsupported') toast('로그인 창이 열리지 않았어요. Safari에서 이 주소를 직접 열어 로그인해 보세요.');
    else if (c === 'auth/unauthorized-domain') toast('Firebase의 승인된 도메인에 이 주소를 추가해야 해요. README 3단계를 봐 주세요.');
    else if (c === 'auth/network-request-failed') toast('인터넷 연결을 확인해 주세요.');
    else toast('로그인하지 못했어요 (' + (c || '알 수 없음') + ').');
  }
}
const CFG = window.FIREBASE_CONFIG;
if (typeof firebase !== 'undefined' && CFG && CFG.apiKey){
  firebase.initializeApp(CFG); AUTH = firebase.auth(); FSDB = firebase.firestore();
  FSDB.enablePersistence({synchronizeTabs: true}).catch(() => {});
  setSync('connecting');
  AUTH.onAuthStateChanged(u => {
    if (unsubSnap){ unsubSnap(); unsubSnap = null; }
    if (!u){ DB = null; UID = null; USER_EMAIL = ''; setSync('login'); if (!carryDone){ carryDone = true; runCarry(); } return; }
    UID = u.uid; USER_EMAIL = u.email || ''; DB = true; firstSync = true; setSync('connecting');
    unsubSnap = FSDB.collection('users').doc(UID).collection('items').onSnapshot({includeMetadataChanges: false}, onSnap, e => { setSync(e && e.code === 'permission-denied' ? 'denied' : 'error'); });
    setTimeout(() => { if (firstSync && !carryDone){ carryDone = true; runCarry(); } }, 5000);
  });
} else { setSync(typeof firebase === 'undefined' && CFG && CFG.apiKey ? 'local' : 'nocfg'); carryDone = true; setTimeout(runCarry, 0); }

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- paper grain ---------- */
try {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); const im = x.createImageData(128, 128);
  for (let k = 0; k < im.data.length; k += 4){ const v = 70 + Math.random() * 130; im.data[k] = im.data[k+1] = im.data[k+2] = v; im.data[k+3] = Math.random() * 16; }
  x.putImageData(im, 0, 0); root.style.setProperty('--grain', `url(${c.toDataURL()})`);
} catch(e){}
